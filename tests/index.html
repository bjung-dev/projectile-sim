<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics Tests</title>
  <style>
    :root { --bg: #fff; --text: #172033; --pass: #15803d; --fail: #b91c1c; --muted: #5b6478; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1220; --text: #e6e9f2; --pass: #4ade80; --fail: #f87171; --muted: #9aa3b8; color-scheme: dark; }
    }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; }
    li { list-style: none; }
    .pass::before { content: "✓ "; color: var(--pass); font-weight: 700; }
    .fail::before { content: "✗ "; color: var(--fail); font-weight: 700; }
    .error { color: var(--fail); font-family: ui-monospace, monospace; font-size: 13px; margin-left: 1.4em; }
    #summary { font-weight: 700; }
    #summary.ok { color: var(--pass); }
    #summary.bad { color: var(--fail); }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Physics validation tests</h1>
    <p>Checks <code>js/physics.js</code> against textbook results. <a href="../index.html">← Back to the simulator</a></p>
    <p id="summary">Running…</p>
    <ul id="results"></ul>
  </main>

  <script>
    // A tiny test runner: test(), assert(), approx(), throws()
    const results = [];
    function test(name, fn) {
      try { fn(); results.push({ name, ok: true }); }
      catch (e) { results.push({ name, ok: false, error: e.message }); }
    }
    function assert(cond, message = "assertion failed") { if (!cond) throw new Error(message); }
    function approx(actual, expected, rel = 1e-9, abs = 1e-9) {
      const ok = Math.abs(actual - expected) <= Math.max(abs, rel * Math.abs(expected));
      assert(ok, `expected ${expected}, got ${actual}`);
    }
    function throws(fn) {
      let threw = false;
      try { fn(); } catch { threw = true; }
      assert(threw, "expected an error to be thrown");
    }
  </script>
  <script src="../js/physics.js"></script>
  <script src="physics.test.js"></script>
  <script>
    const list = document.getElementById("results");
    for (const r of results) {
      const li = document.createElement("li");
      li.className = r.ok ? "pass" : "fail";
      li.textContent = r.name;
      if (!r.ok) li.insertAdjacentHTML("beforeend", `<div class="error"></div>`), (li.lastChild.textContent = r.error);
      list.append(li);
    }
    const failed = results.filter((r) => !r.ok).length;
    const summary = document.getElementById("summary");
    summary.textContent = failed ? `${failed} of ${results.length} tests failed` : `All ${results.length} tests passed`;
    summary.className = failed ? "bad" : "ok";
  </script>
</body>
</html>
